[package]
name = "husmo"
version = "0.1.1"
edition = "2024"
description = "Local-first, git-backed document/link database with a Rust MCP server"
license = "MIT"
repository = "https://github.com/frantufro/husmo"
homepage = "https://github.com/frantufro/husmo"

[[bin]]
name = "husmo"
path = "src/main.rs"

[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
uuid = { version = "1.24.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_norway = "0.9.42"
git2 = { version = "0.21.0", features = ["ssh", "https", "vendored-openssl"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
scraper = "0.27.0"
ego-tree = "0.11.0"
url = "2.5.8"
pdf-extract = "0.12.0"
# Local sentence-embedding model runtime (see src/embed.rs): candle runs
# inference in-process; hf-hub fetches the pre-trained model's weights once
# and caches them under the OS's standard Hugging Face cache directory
# (respecting `HF_HOME`), satisfying the "zero network calls per operation"
# constraint from docs/adr/0001-local-first-no-external-services.md.
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = "0.3"
tokenizers = "0.23.1"
serde_json = "1"
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
# The `schemars::JsonSchema` derive macro's generated code refers to the
# `schemars` crate by its plain name, so it must be a direct dependency here
# even though `rmcp` already re-exports the crate itself (`rmcp::schemars`).
schemars = "1.0"

[dev-dependencies]
lopdf = "0.44.0"
tempfile = "3"
# Only "client" is added here: it lets tests drive the MCP server through a
# real client/server round trip (see `src/mcp_server.rs`'s tests). Everything
# else the server needs is already in the main `rmcp` dependency above.
rmcp = { version = "3.1.4", features = ["client"] }
# Only "io-util" is added here, for `tokio::io::duplex` in the same tests.
tokio = { version = "1", features = ["io-util"] }
