name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Nothing is built or published until the tag and the files that carry a
  # version agree. This check used to live in publish-npm, the last job, so a
  # version left behind was caught only after the GitHub release and the
  # Homebrew formula were already out and needed unpicking by hand.
  verify:
    name: Verify the release
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify the tag and every version file agree
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mismatched=0
          check() {
            [ "$2" = "$VERSION" ] || {
              echo "$1 is $2 but the tag is $VERSION" >&2
              mismatched=1
            }
          }
          check Cargo.toml \
            "$(awk '/^\[package\]/ { inpkg = 1; next } /^\[/ { inpkg = 0 } inpkg && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)"
          check Cargo.lock \
            "$(awk '/^name = "husmo"$/ { getline; gsub(/^version = "|"$/, ""); print; exit }' Cargo.lock)"
          check package.json "$(node -p "require('./package.json').version")"
          check claude-plugin/.claude-plugin/plugin.json \
            "$(node -p "require('./claude-plugin/.claude-plugin/plugin.json').version")"
          check README.md \
            "$(sed -n 's/.*downloaded husmo \([0-9][0-9.]*\) to.*/\1/p' README.md | head -1)"
          [ "$mismatched" -eq 0 ] || exit 1
          echo "version $VERSION agrees across the tag and every version file"

      - name: Install dependencies
        run: npm ci

      - name: Test the installer
        run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            use_cross: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (native)
        if: '!matrix.use_cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ARCHIVE="husmo-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" husmo
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: husmo-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/husmo-*.tar.gz

  publish-homebrew-formula:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute sha256 for each tarball
        id: sha
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            file="artifacts/husmo-${target}.tar.gz"
            if [ ! -f "$file" ]; then
              echo "Missing artifact: $file" >&2
              exit 1
            fi
            sha=$(sha256sum "$file" | awk '{print $1}')
            slug=$(echo "$target" | tr -- '-' '_')
            echo "${slug}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: frantufro/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate formula
        env:
          SHA_MAC_ARM: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}
          SHA_LINUX_ARM: ${{ steps.sha.outputs.aarch64_unknown_linux_gnu }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/husmo.rb <<EOF
          class Husmo < Formula
            desc "Local-first, git-backed document/link database with a Rust MCP server"
            homepage "https://github.com/frantufro/husmo"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/frantufro/husmo/releases/download/${TAG}/husmo-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/frantufro/husmo/releases/download/${TAG}/husmo-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
              on_arm do
                url "https://github.com/frantufro/husmo/releases/download/${TAG}/husmo-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
            end

            def install
              bin.install "husmo"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/husmo --version")
            end
          end
          EOF

      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/husmo.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "husmo ${TAG#v}"
          git push

  publish-npm:
    name: Publish installer to npm
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Required for npm trusted publishing: npm exchanges this token for
      # publish rights, so the repository stores no npm credential.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 bundles an npm new enough for trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Authentication comes from the OIDC token minted for this run, which
      # npm trades for a short-lived publish token. Provenance is automatic.
      - name: Publish
        run: npm publish --access public
