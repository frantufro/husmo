name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Pinned: the pedantic lint set grows with every stable release, so a
      # floating toolchain turns an untouched tree red on rustc's schedule.
      # Bump this deliberately. The test jobs below track stable.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      # `[lints.clippy]` in Cargo.toml already turns the pedantic set on and
      # denies bare `#[allow]`, so this only has to promote warnings to errors.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --locked fails when Cargo.lock is out of date, which catches a version
      # bump that moved Cargo.toml without refreshing the lock.
      - run: cargo test --locked

  installer:
    name: Installer tests (node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor package.json declares, so it gets exercised.
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The installer edits OpenCode's config through jsonc-parser, so the
      # suite needs the dependency tree on disk before it can run.
      - run: npm ci

      - run: npm test
